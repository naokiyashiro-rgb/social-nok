<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Experiment 01</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #0B0C0F; --panel: #14161B; --line: #262A33;
    --text: #F4F4F2; --muted: #8A8F99; --accent: #FF7A45;
    --jp: "Noto Sans JP", sans-serif; --mono: "JetBrains Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; background: var(--bg); }
  body { font-family: var(--jp); color: var(--text); -webkit-font-smoothing: antialiased; }
  #stage { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: var(--bg); }
  .abs { position: absolute; }
  .scene { position: absolute; inset: 0; will-change: transform, opacity; }

  #grid { inset: -120px; background-image:
      linear-gradient(to right, rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 90px 90px; }
  #glow { width: 900px; height: 900px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,122,69,.16), rgba(255,122,69,0) 65%); }

  /* chrome */
  #hud { left: 64px; top: 56px; font: 500 26px var(--mono); color: var(--muted); letter-spacing: .02em; display: flex; align-items: center; gap: 14px; }
  #rec { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); }
  #tc { right: 64px; top: 56px; font: 500 26px var(--mono); color: var(--muted); }
  #bar { left: 64px; right: 64px; bottom: 64px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  #barFill { height: 100%; width: 0; background: var(--accent); }

  .headline { font-weight: 900; letter-spacing: -.02em; line-height: 1.15; white-space: nowrap; }
  .ch { display: inline-block; }
  .cap { left: 80px; top: 150px; font-weight: 900; font-size: 76px; letter-spacing: -.01em; }
  .cap .dim { color: var(--muted); }

  /* S1 */
  #s1text { left: 0; right: 0; top: 520px; text-align: center; font-size: 132px; }
  #s1wipe { left: 0; top: 540px; width: 1080px; height: 170px; background: var(--accent); transform-origin: left center; }
  #s1sub { left: 0; right: 0; top: 720px; text-align: center; font-size: 40px; font-weight: 700; color: var(--muted); }

  /* S2 */
  .card { background: var(--panel); border: 2px solid var(--line); border-radius: 28px; }
  #chart { left: 80px; top: 290px; width: 920px; height: 470px; padding: 34px 40px; }
  #chart .lbl { font: 700 30px var(--mono); color: var(--muted); }
  #chart .big { font: 700 64px var(--mono); color: var(--text); margin-top: 6px; }
  #chart svg { position: absolute; left: 40px; bottom: 30px; }
  .kpi { top: 800px; width: 290px; height: 180px; padding: 26px 28px; }
  .kpi .k { font: 700 28px var(--mono); color: var(--muted); }
  .kpi .v { font: 700 66px var(--mono); margin-top: 10px; }
  #ad { left: 80px; top: 1015px; width: 920px; height: 180px; padding: 26px 32px; }
  #ad .row { display: flex; align-items: center; gap: 20px; margin-top: 16px; font: 700 28px var(--mono); color: var(--muted); }
  #ad .track { flex: 1; height: 26px; background: #1E2128; border-radius: 13px; overflow: hidden; }
  #ad .fill { height: 100%; border-radius: 13px; }
  #ad .tag { font: 700 26px var(--mono); padding: 4px 14px; border-radius: 10px; background: var(--accent); color: #0B0C0F; }

  /* S3 */
  .win { width: 600px; background: var(--panel); border: 2px solid var(--line); border-radius: 22px; overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.55); }
  .win .tb { height: 58px; display: flex; align-items: center; gap: 12px; padding: 0 22px; border-bottom: 2px solid var(--line); font: 500 24px var(--mono); color: var(--muted); }
  .win .dot { width: 14px; height: 14px; border-radius: 50%; background: #343844; }
  .win .dot.on { background: var(--accent); }
  .win .body { padding: 22px 26px; font: 500 30px/1.6 var(--mono); white-space: pre; min-height: 200px; }
  .ok { color: var(--accent); }
  .mu { color: var(--muted); }
  .pbar { height: 16px; background: #1E2128; border-radius: 8px; overflow: hidden; margin-top: 18px; }
  .pbar div { height: 100%; background: var(--accent); }

  /* S4 */
  #s4a { left: 0; right: 0; top: 430px; text-align: center; font-size: 118px; }
  #s4b { left: 0; right: 0; top: 590px; text-align: center; font-size: 190px; color: var(--accent); }
  #cursor { display: inline-block; width: .5em; height: .9em; background: var(--text); vertical-align: -0.08em; margin-left: .06em; }
  #s4log { left: 190px; width: 700px; top: 900px; font: 500 30px var(--mono); color: var(--muted); }
  #s4log .pbar { height: 18px; margin-top: 18px; }

  /* S5 */
  .tile { width: 440px; height: 440px; padding: 44px; display: flex; flex-direction: column; justify-content: space-between; }
  .tile svg { width: 130px; height: 130px; }
  .tile .t { font-size: 76px; font-weight: 900; line-height: 1; }
  .tile .m { font: 700 34px var(--mono); color: var(--muted); margin-top: 16px; }

  /* S6 */
  .end { left: 90px; font-size: 118px; }
  #s6c { font-size: 104px; }
  #uline { left: 90px; top: 1000px; height: 14px; width: 930px; background: var(--accent); transform-origin: left center; border-radius: 7px; }
  #sign { left: 90px; top: 1080px; font: 700 40px var(--mono); color: var(--muted); }
  #sign b { color: var(--text); }
</style>
</head>
<body>
<div id="stage">
  <div id="grid" class="abs"></div>
  <div id="glow" class="abs"></div>

  <!-- S1 -->
  <div id="s1" class="scene">
    <div id="s1text" class="abs headline"></div>
    <div id="s1wipe" class="abs"></div>
    <div id="s1sub" class="abs">マーケ・運営・開発、ぜんぶ1人。</div>
  </div>

  <!-- S2 -->
  <div id="s2" class="scene">
    <div id="s2cap" class="abs cap">マーケ <span class="dim">/</span> 事業運営</div>
    <div id="chart" class="abs card">
      <div class="lbl">IMPRESSIONS / 30d</div>
      <div class="big" id="impr">0</div>
      <svg width="840" height="250" viewBox="0 0 840 250">
        <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FF7A45" stop-opacity=".35"/><stop offset="1" stop-color="#FF7A45" stop-opacity="0"/></linearGradient>
          <clipPath id="cclip"><rect id="cclipr" x="0" y="0" width="0" height="250"/></clipPath></defs>
        <g stroke="#262A33" stroke-width="2"><line x1="0" y1="62" x2="840" y2="62"/><line x1="0" y1="125" x2="840" y2="125"/><line x1="0" y1="188" x2="840" y2="188"/></g>
        <path id="area" clip-path="url(#cclip)" fill="url(#ag)"/>
        <path id="line" fill="none" stroke="#FF7A45" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <circle id="head" r="12" fill="#FF7A45"/>
      </svg>
    </div>
    <div id="k1" class="abs card kpi" style="left:80px"><div class="k">CTR</div><div class="v" id="v1">0</div></div>
    <div id="k2" class="abs card kpi" style="left:395px"><div class="k">CVR</div><div class="v" id="v2">0</div></div>
    <div id="k3" class="abs card kpi" style="left:710px"><div class="k">ROAS</div><div class="v" id="v3">0</div></div>
    <div id="ad" class="abs card">
      <div style="font: 700 30px var(--jp); display:flex; justify-content:space-between"><span>広告 A/Bテスト</span><span class="tag" id="adtag">B WIN</span></div>
      <div class="row">A<div class="track"><div class="fill" id="fa" style="background:#4A4F5C"></div></div></div>
      <div class="row">B<div class="track"><div class="fill" id="fb" style="background:var(--accent)"></div></div></div>
    </div>
  </div>

  <!-- S3 -->
  <div id="s3" class="scene">
    <div id="s3cap" class="abs cap">AIを、<span style="color:var(--accent)">並列</span>で動かす。</div>
    <div id="wins"></div>
  </div>

  <!-- S4 -->
  <div id="s4" class="scene">
    <div id="s4a" class="abs headline"><span id="s4typed"></span><span id="cursor"></span></div>
    <div id="s4b" class="abs headline">開発中</div>
    <div id="s4log" class="abs">
      <div style="display:flex;justify-content:space-between"><span>building my-agent v0.3</span><span id="pct">0%</span></div>
      <div class="pbar"><div id="s4fill"></div></div>
      <div style="margin-top:18px" id="s4note"></div>
    </div>
  </div>

  <!-- S5 -->
  <div id="s5" class="scene"></div>

  <!-- S6 -->
  <div id="s6" class="scene">
    <div id="s6a" class="abs headline end" style="top:560px">仕事も、</div>
    <div id="s6b" class="abs headline end" style="top:700px">自分も、</div>
    <div id="s6c" class="abs headline end" style="top:845px">アップデートする。</div>
    <div id="uline" class="abs"></div>
    <div id="sign" class="abs"><b>@naokichi_nok</b>　Made with Claude</div>
  </div>

  <!-- HUD -->
  <div id="hud" class="abs"><div id="rec"></div>REC 実験ログ #01 — Claudeで動画制作</div>
  <div id="tc" class="abs">00:00.0</div>
  <div id="bar" class="abs"><div id="barFill"></div></div>
</div>

<script>
const DURATION = 15;
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, s, e) => clamp((t - s) / (e - s));
const eo = x => 1 - Math.pow(1 - x, 3);
const eo5 = x => 1 - Math.pow(1 - x, 5);
const ei = x => x * x * x;
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const typed = (s, t, start, cps) => { const chars = [...s]; return chars.slice(0, Math.floor(clamp((t - start) * cps, 0, chars.length))).join(''); };
function style(el, { x = 0, y = 0, s = 1, sx, r = 0, o = 1, blur = 0 }) {
  el.style.opacity = o;
  el.style.visibility = o <= 0.001 ? 'hidden' : 'visible';
  el.style.transform = `translate(${x}px, ${y}px) rotate(${r}deg) scale(${sx ?? s}, ${s})`;
  el.style.filter = blur > 0.05 ? `blur(${blur}px)` : 'none';
}
// scene window: fade in over [a, a+fin], out over [b-fout, b]
const win = (t, a, b) => t >= a && t < b;

/* ---------- build DOM ---------- */
const S1 = 'フリーで働く。';
$('s1text').innerHTML = [...S1].map(c => `<span class="ch">${c}</span>`).join('');
const s1chars = [...$('s1text').children];

// chart path
const pts = [];
const N = 60;
for (let i = 0; i <= N; i++) {
  const x = i / N;
  const trend = Math.pow(x, 1.7);
  const wob = Math.sin(i * 1.3) * .05 + Math.sin(i * .47) * .06;
  const dip = i > 22 && i < 30 ? -.08 : 0;
  pts.push([x * 800 + 20, 230 - clamp(trend * .85 + .06 + wob * (0.4 + x) + dip, 0, 1) * 215]);
}
const linePath = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
$('line').setAttribute('d', linePath);
$('area').setAttribute('d', linePath + ` L ${pts[N][0]} 250 L ${pts[0][0]} 250 Z`);
const lineLen = $('line').getTotalLength();
$('line').style.strokeDasharray = lineLen;

// windows
const WINS = [
  { x: 70, y: 300, title: 'claude — terminal', lines: [['$ claude', ''], ['> X投稿の分析を開始', 'mu'], ['✓ 42件のデータを取得', 'ok']] },
  { x: 410, y: 430, title: 'agent: research', lines: [['▸ トレンド調査中…', 'mu'], ['AIエージェント  ↑', ''], ['睡眠 × 生産性  ↑', '']] },
  { x: 100, y: 610, title: 'agent: writer', lines: [['投稿案を生成中', ''], ['3 / 4 完了', 'ok']], bar: true },
  { x: 430, y: 790, title: 'agent: reply', lines: [['返信案 A / B / C', ''], ['トーン: 親しみ強め', 'mu'], ['✓ 5件 作成', 'ok']] },
  { x: 150, y: 930, title: 'memory.md', lines: [['# 自分ルール', 'ok'], ['- 質 > 量', ''], ['- 失敗も出す', '']] },
];
$('wins').innerHTML = WINS.map((w, i) => `
  <div class="abs win" id="w${i}" style="left:${w.x}px;top:${w.y}px">
    <div class="tb"><span class="dot on"></span><span class="dot"></span><span class="dot"></span><span style="margin-left:10px">${w.title}</span></div>
    <div class="body">${w.lines.map((l, j) => `<div class="${l[1]}" id="w${i}l${j}"></div>`).join('')}${w.bar ? `<div class="pbar"><div id="w${i}bar"></div></div>` : ''}</div>
  </div>`).join('');

// tiles
const ICON = {
  sleep: '<path d="M88 18a52 52 0 1 0 28 88A44 44 0 0 1 88 18z"/><path d="M96 34h18l-18 20h18"/>',
  gym: '<rect x="14" y="44" width="14" height="42" rx="4"/><rect x="28" y="32" width="16" height="66" rx="4"/><rect x="86" y="32" width="16" height="66" rx="4"/><rect x="102" y="44" width="14" height="42" rx="4"/><path d="M44 65h42"/>',
  mind: '<path d="M8 70h28l10-26 16 52 14-40 10 14h36"/>',
  work: '<rect x="20" y="24" width="90" height="60" rx="8"/><path d="M8 100h114"/><path d="M46 54l12 12 24-24"/>',
};
const TILES = [
  { x: 80, y: 250, icon: 'sleep', t: '睡眠', m: '7h 12m' },
  { x: 560, y: 250, icon: 'gym', t: '筋トレ', m: '週3回' },
  { x: 80, y: 730, icon: 'mind', t: 'メンタル', m: 'HRV ↑' },
  { x: 560, y: 730, icon: 'work', t: '仕事', m: 'Tasks 12/12' },
];
$('s5').innerHTML = TILES.map((d, i) => `
  <div class="abs card tile" id="t${i}" style="left:${d.x}px;top:${d.y}px">
    <svg viewBox="0 0 130 130" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" id="ti${i}">${ICON[d.icon]}</svg>
    <div><div class="t">${d.t}</div><div class="m">${d.m}</div></div>
  </div>`).join('');

/* ---------- render(t) ---------- */
function render(t) {
  // background motion (always moving)
  $('grid').style.transform = `translate(${-(t * 22) % 90}px, ${-(t * 34) % 90}px)`;
  const gx = 540 + Math.sin(t * .7) * 260 - 450, gy = 600 + Math.cos(t * .5) * 280 - 450;
  $('glow').style.transform = `translate(${gx}px, ${gy}px) scale(${1 + .1 * Math.sin(t * 2)})`;

  // HUD
  $('rec').style.opacity = (Math.floor(t * 2) % 2 === 0) ? 1 : .25;
  $('tc').textContent = `00:${String(Math.floor(t)).padStart(2, '0')}.${Math.floor((t % 1) * 10)}`;
  $('barFill').style.width = (clamp(t / DURATION) * 100) + '%';

  /* S1: 0 - 2.1 */
  const s1 = $('s1');
  if (win(t, 0, 2.15)) {
    const out = eo(prog(t, 1.85, 2.12));
    style(s1, { x: -140 * out, o: 1 - out, blur: 10 * out, s: 1 + .05 * eo(prog(t, 0, 2)) });
    // wipe: grow from left, then retract to right
    const w1 = eo5(prog(t, 0, .28)), w2 = eio(prog(t, .3, .62));
    const wipe = $('s1wipe');
    wipe.style.transformOrigin = t < .3 ? 'left center' : 'right center';
    wipe.style.transform = `scaleX(${t < .3 ? w1 : 1 - w2})`;
    s1chars.forEach((c, i) => {
      const p = prog(t, .3 + i * .045, .3 + i * .045 + .32);
      style(c, { y: 90 * (1 - eo(p)), s: lerp(1.35, 1, back(p)), o: p > 0 ? 1 : 0, blur: 8 * (1 - eo(p)) });
    });
    const sp = eo(prog(t, .95, 1.35));
    style($('s1sub'), { y: 30 * (1 - sp), o: sp });
  } else style(s1, { o: 0 });

  /* S2: 2.0 - 5.1 */
  const s2 = $('s2');
  if (win(t, 1.95, 5.15)) {
    const out = ei(prog(t, 4.85, 5.12));
    style(s2, { s: 1 - .08 * out, o: 1 - out, blur: 8 * out });
    const cp = eo(prog(t, 1.98, 2.3));
    style($('s2cap'), { y: 50 * (1 - cp), o: cp });
    const ch = eo(prog(t, 2.05, 2.4));
    style($('chart'), { y: 80 * (1 - ch), o: ch });
    const lp = eio(prog(t, 2.2, 3.4));
    $('line').style.strokeDashoffset = lineLen * (1 - lp);
    const hp = $('line').getPointAtLength(lineLen * lp);
    $('head').setAttribute('cx', hp.x); $('head').setAttribute('cy', hp.y);
    $('head').setAttribute('opacity', lp > 0 ? 1 : 0);
    $('cclipr').setAttribute('width', hp.x);
    $('impr').textContent = Math.round(128400 * lp).toLocaleString('en-US');
    [['k1', 'v1', 3.8, '%', 1], ['k2', 'v2', 24, '%', 0, '+'], ['k3', 'v3', 412, '%', 0]].forEach(([k, v, val, suf, dec, pre = ''], i) => {
      const a = 2.45 + i * .15;
      const p = prog(t, a, a + .35);
      style($(k), { y: 60 * (1 - eo(p)), s: lerp(.85, 1, back(p)), o: clamp(p * 3) });
      const n = val * eo(prog(t, a + .1, a + 1.1));
      $(v).textContent = pre + n.toFixed(dec) + suf;
      $(v).style.color = prog(t, a + 1.1, a + 1.2) > 0 && i === 2 ? 'var(--accent)' : 'var(--text)';
    });
    const ap = eo(prog(t, 3.1, 3.5));
    style($('ad'), { x: 300 * (1 - ap), o: ap });
    $('fa').style.width = (58 * eo(prog(t, 3.35, 4.1))) + '%';
    $('fb').style.width = (88 * eo(prog(t, 3.45, 4.3))) + '%';
    const tg = prog(t, 4.25, 4.5);
    style($('adtag'), { s: lerp(1.6, 1, back(tg)), o: tg > 0 ? 1 : 0 });
  } else style(s2, { o: 0 });

  /* S3: 4.95 - 8.3 */
  const s3 = $('s3');
  if (win(t, 4.95, 8.3)) {
    style(s3, { o: 1 });
    const cp = eo(prog(t, 5.0, 5.3));
    const cout = ei(prog(t, 7.85, 8.1));
    style($('s3cap'), { y: 50 * (1 - cp) - 40 * cout, o: cp * (1 - cout) });
    const conv = eio(prog(t, 7.9, 8.28));
    WINS.forEach((w, i) => {
      const a = 5.0 + i * .3;
      const p = prog(t, a, a + .38);
      const drift = Math.sin(t * 1.4 + i) * 8;
      // converge toward center (540, 675) on exit
      const cx = 540 - (w.x + 300), cy = 675 - (w.y + 130);
      style($('w' + i), {
        x: cx * conv, y: 70 * (1 - eo(p)) + drift + cy * conv,
        s: lerp(.7, 1, back(p)) * (1 - .85 * conv), o: clamp(p * 3) * (1 - conv), r: (i % 2 ? 1 : -1) * 1.2 * (1 - eo(p))
      });
      w.lines.forEach((l, j) => {
        const st = a + .25 + j * .32;
        $(`w${i}l${j}`).textContent = typed(l[0], t, st, 28) || ' ';
      });
      if (w.bar) $(`w${i}bar`).style.width = (75 * eo(prog(t, a + .4, a + 1.6))) + '%';
    });
  } else style(s3, { o: 0 });

  /* S4: 8.05 - 11.2 */
  const s4 = $('s4');
  if (win(t, 8.05, 11.2)) {
    const out = ei(prog(t, 10.9, 11.15));
    style(s4, { s: 1 + .25 * out, o: 1 - out, blur: 10 * out });
    const inp = eo(prog(t, 8.05, 8.3));
    style($('s4a'), { s: lerp(.9, 1, inp), o: inp });
    $('s4typed').textContent = typed('自分専用AIを', t, 8.15, 9);
    $('cursor').style.opacity = t < 9 || Math.floor(t * 3) % 2 === 0 ? 1 : 0;
    const bp = prog(t, 8.95, 9.3);
    style($('s4b'), { s: lerp(1.5, 1, back(bp)), o: clamp(bp * 2.5), blur: 12 * (1 - eo(bp)) });
    const lp = eo(prog(t, 9.3, 9.6));
    style($('s4log'), { y: 40 * (1 - lp), o: lp });
    const pct = Math.round(68 * eio(prog(t, 9.4, 10.7)));
    $('pct').textContent = pct + '%';
    $('s4fill').style.width = pct + '%';
    $('s4note').textContent = typed('# 試行錯誤中。まだ途中。', t, 9.9, 16) || ' ';
  } else style(s4, { o: 0 });

  /* S5: 11.05 - 13.15 */
  const s5 = $('s5');
  if (win(t, 11.05, 13.15)) {
    const out = ei(prog(t, 12.85, 13.12));
    style(s5, { s: 1 - .5 * out, o: 1 - out });
    const active = clamp(Math.floor((t - 11.15) / .3), 0, 3);
    TILES.forEach((d, i) => {
      const a = 11.1 + i * .3;
      const p = prog(t, a, a + .32);
      const cx = (540 - (d.x + 220)) * .35, cy = (675 - (d.y + 220)) * .35;
      style($('t' + i), { x: cx * (1 - eo(p)), y: cy * (1 - eo(p)), s: lerp(.6, 1, back(p)), o: clamp(p * 3) });
      const on = i === active && t < 12.5 || t >= 12.5;
      $('t' + i).style.borderColor = on ? 'var(--accent)' : 'var(--line)';
      $('ti' + i).style.color = on ? 'var(--accent)' : 'var(--text)';
    });
  } else style(s5, { o: 0 });

  /* S6: 13.0 - 15 */
  const s6 = $('s6');
  if (t >= 13.0) {
    style(s6, { s: 1 + .03 * prog(t, 13.5, 15) });
    [['s6a', 13.02], ['s6b', 13.25], ['s6c', 13.5]].forEach(([id, a]) => {
      const p = prog(t, a, a + .4);
      style($(id), { y: 80 * (1 - eo5(p)), o: clamp(p * 2), blur: 8 * (1 - eo(p)) });
    });
    $('uline').style.transform = `scaleX(${eo5(prog(t, 13.85, 14.3))})`;
    const sp = eo(prog(t, 14.1, 14.45));
    style($('sign'), { y: 30 * (1 - sp), o: sp });
  } else style(s6, { o: 0 });
}
window.render = render;
window.ALL_TEXT = document.body.innerText + WINS.map(w => w.lines.map(l => l[0]).join('')).join('') + '自分専用AIを開発中試行錯誤中。まだ途中。0123456789%+,.';
render(0);
</script>
